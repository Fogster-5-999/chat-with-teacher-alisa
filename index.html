<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Переписка с учительницей</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">
    <div id="header">
        <div id="avatar">👩‍🏫</div>
        <div id="contact-name">Алиса Сергеевна</div>
        <div id="status">была сегодня</div>
    </div>

    <div id="stats-bar">
        <div class="stat-item">
            <span class="stat-icon">📚</span>
            <span class="stat-label">Успеваемость</span>
            <span class="stat-value" id="stat-success">0</span>
        </div>
        <div class="stat-item">
            <span class="stat-icon">❤️</span>
            <span class="stat-label">Романтика</span>
            <span class="stat-value" id="stat-romance">0</span>
        </div>
        <div class="stat-item">
            <span class="stat-icon">😂</span>
            <span class="stat-label">Юмор</span>
            <span class="stat-value" id="stat-humor">0</span>
        </div>
    </div>

    <div id="messages">
        <div id="typing-indicator" class="typing-indicator" style="display:none;">
            <span>Алиса печатает</span>
            <span class="dots">.</span>
        </div>
    </div>

    <div id="options"></div>

    <div id="ad-overlay">
        <div class="ad-spinner"></div>
        <div>Показываем рекламу...</div>
        <div style="font-size:14px; margin-top:12px; color:#8ba9b9;">(в реальной игре будет реклама Яндекса)</div>
        <button id="close-ad-btn" style="margin-top:20px; padding:10px 30px; border:none; border-radius:30px; background:#4d7b8f; color:#fff; font-size:16px; cursor:pointer;">Закрыть рекламу</button>
    </div>
</div>

<script src="story.js"></script>
<script src="script.js"></script>
</body>
</html>
